services:
  model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:41988e510b6fe0a0b5b9be00a9dbf91d9f0fa691da173d7b06d97d370329fe84
    command: ["-m", "/models/SmolVLM-256M-Instruct-Q8_0.gguf", "--mmproj", "/models/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf", "--alias", "local", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "2048", "--parallel", "1", "--threads", "2", "--n-gpu-layers", "0", "--no-mmproj-offload", "--no-webui", "--no-slots", "--offline", "--log-verbosity", "1"]
    volumes:
      - ./.models:/models:ro
    networks: [model]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
  app:
    build: .
    environment:
      MODEL_URL: http://model:8080
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configurer une URL HTTPS exacte}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:?Configurer un mot de passe privé}
    ports: ["127.0.0.1:3000:3000"]
    networks: [model, web]
    depends_on: [model]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
networks:
  model:
    internal: true
  web: {}
